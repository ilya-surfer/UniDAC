[project]
name = "unidac"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "black==23.3.0",
    "einops==0.8.1",
    "isort==5.12.0",
    "matplotlib>=3.10.9",
    "mypy>=2.1.0",
    "numpy<2.0.0",
    "opencv-python>=4.11.0.86",
    "pydocstyle>=6.3.0",
    "pylint>=4.0.5",
    "pytest==7.4.2",
    "scipy>=1.15.3",
    "setuptools>=80.9.0",
    "tensorboard>=2.20.0",
    "timm==0.6.13",
    "torch==2.1.0",
    "tqdm==4.42.1",
    "wandb<0.19.0",
    "wheel>=0.47.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["unidac*"]
